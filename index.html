<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日清静 · 澄一</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "KaiTi", "STKaiti", "Kaiti SC", "楷体", "Songti SC", serif;
    overflow: hidden;
    transition: background 1.5s ease, color 1.5s ease;
  }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }

  /* ===== 夜晚主题（默认） ===== */
  body {
    background: radial-gradient(ellipse at 50% 30%, #2a2d33 0%, #1a1c20 50%, #0e0f12 100%);
    color: #d8d4c8;
  }
  body .line { color: #e8e4d8; text-shadow: 0 0 30px rgba(200,200,180,0.1); }
  body .date { color: #8a8a8a; }
  body .clock { color: #b8b4a8; }
  body .source { color: #7a7a7a; }
  body .footer { color: #5a5a5a; }
  body .divider { background: #4a4a4a; }
  body .mountains path:first-child { fill: #1f2228; }
  body .mountains path:last-child { fill: #171920; }
  body .mist { background: linear-gradient(to top, rgba(200,200,200,0.07), transparent); }
  body .actions button { border-color: #3a3a3a; color: #8a8a8a; }
  body .actions button:hover { border-color: #b85450; color: #d8d4c8; }
  body .seal { border-color: #8b3a3a; color: #b85450; }

  /* ===== 白天主题 ===== */
  body.day {
    background: radial-gradient(ellipse at 50% 30%, #e8e2d0 0%, #d4cdb8 50%, #bfb8a0 100%);
    color: #4a4538;
  }
  body.day .line { color: #3a3528; text-shadow: 0 0 20px rgba(100,90,60,0.1); }
  body.day .date { color: #8a8270; }
  body.day .clock { color: #6a6250; }
  body.day .source { color: #9a9280; }
  body.day .footer { color: #8a8270; }
  body.day .divider { background: #b0a890; }
  body.day .mountains path:first-child { fill: #b0a890; opacity: 0.5; }
  body.day .mountains path:last-child { fill: #9a9280; opacity: 0.5; }
  body.day .mist { background: linear-gradient(to top, rgba(255,255,255,0.25), transparent); }
  body.day .actions button { border-color: #a09880; color: #7a7260; }
  body.day .actions button:hover { border-color: #8b3a3a; color: #3a3528; }
  body.day .seal { border-color: #8b3a3a; color: #8b3a3a; }

  /* 远山 */
  .mountains {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 45%;
    pointer-events: none;
    opacity: 0.6;
    transition: opacity 1.5s ease;
  }

  /* 双层雾气 */
  .mist {
    position: absolute;
    left: -20%;
    width: 140%;
    height: 30%;
    filter: blur(25px);
    pointer-events: none;
  }
  .mist-1 { bottom: 8%; animation: drift1 40s linear infinite; }
  .mist-2 { bottom: 22%; height: 20%; opacity: 0.6; animation: drift2 60s linear infinite reverse; }
  @keyframes drift1 { 0%{transform:translateX(-5%)} 50%{transform:translateX(5%)} 100%{transform:translateX(-5%)} }
  @keyframes drift2 { 0%{transform:translateX(5%)} 50%{transform:translateX(-5%)} 100%{transform:translateX(5%)} }

  /* 顶部 */
  .date {
    position: absolute;
    top: 2rem;
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    font-family: "Songti SC", serif;
    text-align: center;
    line-height: 2;
  }
  .clock {
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    font-variant-numeric: tabular-nums;
  }

  /* 中央诗句 */
  .verse {
    max-width: 720px;
    text-align: center;
    z-index: 2;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .verse.fade { opacity: 0; transform: translateY(10px); }
  .verse .line {
    font-size: clamp(1.3rem, 4vw, 2.2rem);
    line-height: 2;
    letter-spacing: 0.12em;
  }

  /* 按钮 */
  .actions {
    position: absolute;
    display: flex;
    gap: 1rem;
    z-index: 3;
    flex-wrap: wrap;
    justify-content: center;
  }
  .actions-row1 { bottom: 5.5rem; }
  .actions-row2 { bottom: 3.5rem; }
  .actions button {
    background: transparent;
    border: 1px solid;
    padding: 8px 20px;
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  /* 落款 */
  .footer {
    position: absolute;
    bottom: 1.5rem;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
  }
  .seal {
    display: inline-block;
    margin-left: 0.5rem;
    padding: 2px 8px;
    border: 1px solid;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    transform: translateY(-2px);
  }

  .divider {
    width: 60px; height: 1px;
    margin: 1.5rem auto;
  }
  .verse .source {
    margin-top: 1.5rem;
    font-size: 0.9rem;
    letter-spacing: 0.5em;
  }

  /* 翻译面板 */
  .translate-panel {
    position: fixed;
    top: 120px;
    right: 2rem;
    width: 280px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 1.5rem;
    border: 1px solid #8a7a5a;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    z-index: 10;
    font-size: 0.9rem;
    line-height: 2;
    letter-spacing: 0.05em;
    display: none;
    color: #d8d4c8;
  }
  body.day .translate-panel { background: rgba(255,255,255,0.8); color: #4a4538; border-color: #a09880; }
  .translate-panel.show { display: block; }
  .translate-panel h3 {
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    margin-bottom: 1rem;
    text-align: center;
  }

  /* 全文面板 */
  .full-panel {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #1a1c20;
    z-index: 100;
    display: none;
    overflow-y: auto;
    padding: 3rem 2rem;
    color: #d8d4c8;
    scrollbar-width: none;
  }
  .full-panel::-webkit-scrollbar { display: none; }
  body.day .full-panel { background: #e8e2d0; color: #4a4538; }
  .full-panel.show { display: block; }
  .full-panel .content {
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
    line-height: 2.5;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
  }
  .full-panel .content h2 {
    font-size: 1rem;
    letter-spacing: 0.5em;
    margin-bottom: 2rem;
    font-weight: normal;
  }
  .full-panel .close-btn {
    position: fixed;
    top: 1.5rem; right: 1.5rem;
    background: transparent;
    border: 1px solid;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    z-index: 101;
  }
  .font-controls {
    position: fixed;
    bottom: 20px; right: 30px;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 101;
  }
  .font-controls button {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid;
    background: transparent;
    font-size: 1.3rem;
    cursor: pointer;
    font-family: inherit;
  }
  .font-controls .full-only { display: none; }
  .font-controls.show .full-only { display: block; }

  /* 手机端 */
  @media (max-width: 600px) {
    .date { top: 1.5rem; font-size: 0.8rem; letter-spacing: 0.25em; }
    .clock { font-size: 1rem; }
    .verse .line { letter-spacing: 0.08em; }
    .actions-row1 { bottom: 5rem; gap: 0.6rem; }
    .actions-row2 { bottom: 3.2rem; gap: 0.6rem; }
    .actions button { padding: 6px 14px; font-size: 0.75rem; letter-spacing: 0.2em; }
    .footer { font-size: 0.65rem; }
    .translate-panel { right: 1rem; left: 1rem; width: auto; top: 100px; max-height: 50vh; font-size: 0.85rem; }
    .full-panel { padding: 2rem 1rem; }
    .full-panel .content { max-width: 100%; font-size: 0.95rem; line-height: 2.2; }
    .font-controls { bottom: 14px; right: 16px; }
    .font-controls button { width: 38px; height: 38px; font-size: 1.1rem; }
    .full-panel .close-btn { top: 1rem; right: 1rem; width: 36px; height: 36px; font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="date">
  <div id="date"></div>
  <div class="clock" id="clock"></div>
</div>

<div class="verse" id="verse">
  <div class="line" id="line1"></div>
  <div class="line" id="line2"></div>
  <div class="divider"></div>
  <div class="source">太上老君说常清静经</div>
</div>

<svg class="mountains" viewBox="0 0 1440 400" preserveAspectRatio="none">
  <path d="M0,300 L120,200 L240,260 L360,150 L480,230 L600,180 L720,250 L840,170 L960,240 L1080,190 L1200,260 L1320,210 L1440,280 L1440,400 L0,400 Z"/>
  <path d="M0,340 L180,280 L320,320 L480,260 L640,310 L800,270 L960,320 L1120,280 L1280,320 L1440,290 L1440,400 L0,400 Z"/>
</svg>
<div class="mist mist-1"></div>
<div class="mist mist-2"></div>

<div class="actions actions-row1">
  <button id="btnFirst">第一句</button>
  <button id="btnTranslate">翻译</button>
  <button id="btnFull">看全文</button>
</div>
<div class="actions actions-row2">
  <button id="btnPrev">上一句</button>
  <button id="btnToday">今日</button>
  <button id="btnNext">下一句</button>
</div>

<div class="translate-panel" id="translatePanel">
  <h3>白 话</h3>
  <div id="translateText"></div>
</div>

<div class="full-panel" id="fullPanel">
  <button class="close-btn" onclick="closeFull()">✕</button>
  <div class="content" id="fullContent"></div>
</div>

<div class="font-controls" id="fontControls">
  <button class="full-only" onclick="toggleFullTranslate()">译</button>
  <button class="full-only" onclick="changeFontSize(-0.1)">－</button>
  <button class="full-only" onclick="changeFontSize(0.1)">＋</button>
  <button id="themeBtn" onclick="toggleTheme()" title="切换白天/夜晚">🌙</button>
  <button id="musicBtn" onclick="toggleBgm()">🔇</button>
</div>

<div class="footer">
  澄一 · 每日清静<span class="seal">澄一</span>
</div>

<script>
  // 《清静经》全文 完整断句
  const verses = [
    ["大道无形，生育天地；", "大道无情，运行日月。"],
    ["大道无名，长养万物；", "吾不知其名，强名曰道。"],
    ["夫道者：有清有浊，", "有动有静。"],
    ["天清地浊，天动地静；", "男清女浊，男动女静。"],
    ["降本流末，", "而生万物。"],
    ["清者，浊之源；", "动者，静之基。"],
    ["人能常清静，", "天地悉皆归。"],
    ["夫人神好清，而心扰之；", "人心好静，而欲牵之。"],
    ["常能遣其欲，而心自静；", "澄其心，而神自清。"],
    ["自然六欲不生，", "三毒消灭。"],
    ["所以不能者，", "为心未澄，欲未遣也。"],
    ["能遣之者：内观其心，", "心无其心。"],
    ["外观其形，形无其形；", "远观其物，物无其物。"],
    ["三者既悟，", "唯见于空。"],
    ["观空亦空，", "空无所空。"],
    ["所空既无，", "无无亦无。"],
    ["无无既无，", "湛然常寂。"],
    ["寂无所寂，", "欲岂能生。"],
    ["欲既不生，", "即是真静。"],
    ["真常应物，真常得性；", "常应常静，常清静矣。"],
    ["如此清静，渐入真道；", "既入真道，名为得道。"],
    ["虽名得道，", "实无所得。"],
    ["为化众生，", "名为得道。"],
    ["能悟之者，", "可传圣道。"],
    ["上士无争，下士好争；", "上德不德，下德执德。"],
    ["执著之者，", "不名道德。"],
    ["众生所以不得真道者，", "为有妄心。"],
    ["既有妄心，即惊其神；", "既惊其神，即著万物。"],
    ["既著万物，即生贪求；", "既生贪求，即是烦恼。"],
    ["烦恼妄想，忧苦身心；", "便遭浊辱，流浪生死。"],
    ["常沉苦海，", "永失真道。"],
    ["真常之道，悟者自得；", "得悟道者，常清静矣。"],
    ["仙人葛翁曰：吾得真道，", "曾诵此经万遍。"],
    ["此经是天人所习，", "不传下士。"],
    ["上士悟之，升为天宫；", "中士习之，福寿增益。"],
    ["下士得之，在世长年；", "游行三界，升入金门。"]
  ];

  // 白话翻译
  const translations = [
    ["大道没有形状，却化育了天地；大道没有情感，却运行着日月。"],
    ["大道没有名称，却养育了万物；我不知道它叫什么，勉强叫它「道」。"],
    ["道这个东西，有清有浊，有动有静。"],
    ["天属清，地属浊；天主动，地主静。男属清，女属浊；男主动，女主静。"],
    ["从本源流落到末梢，就化生出了万物。"],
    ["清，是浊的源头；动，是静的根基。"],
    ["人若能常常清静，天地间的一切就都归于他了。"],
    ["人的本性喜欢清，但心念打扰了它；人心喜欢静，但欲望牵引了它。"],
    ["常常能排遣欲望，心自然就静了；澄清内心，精神自然就清了。"],
    ["自然六种欲望不生，贪、嗔、痴三毒也就消灭了。"],
    ["之所以做不到，是因为心还没澄清，欲望还没排遣。"],
    ["能排遣欲望的人，向内观照心，心其实没有实体。"],
    ["向外观察身体，身体其实没有实体；远观外物，外物也没有实体。"],
    ["这三者都悟透了，就只看见空了。"],
    ["连「空」也要观空，空也不可执著。"],
    ["所空的都空掉了，连「无」也没有了。"],
    ["连无也无了，就湛然常寂了。"],
    ["寂到无可再寂，欲望还怎么生得出来？"],
    ["欲望既然不生，就是真正的清静。"],
    ["真常之道应接万物，又能保持本性；常常应接万物又常常清静。"],
    ["这样的清静，渐渐进入真道；既然入了真道，就叫做得道。"],
    ["虽然名叫得道，其实并没有得到什么。"],
    ["为了教化众生，勉强叫它得道罢了。"],
    ["能悟到这个境界的人，就可以传圣道了。"],
    ["上士不争，下士好争；上德不表现为德，下德死死执著于德。"],
    ["执著于表象的，不配叫道德。"],
    ["众生之所以得不到真道，是因为有妄心。"],
    ["有了妄心，就惊扰了精神；惊扰了精神，就执著于万物。"],
    ["执著于万物，就生起贪求；生起贪求，就是烦恼。"],
    ["烦恼妄想，忧愁苦身心；于是遭受浊辱，在生死中轮回。"],
    ["常常沉沦在苦海里，永远失去了真道。"],
    ["真常之道，悟到的人自然得到；得到悟道的人，就永远清静了。"],
    ["仙人葛翁说：我得到真道后，曾经诵读此经万遍。"],
    ["此经是天人修习的经典，不会传给下士。"],
    ["上士悟了此经，升为天宫；中士修了此经，福寿增长。"],
    ["下士得了此经，在世长寿；游行三界，升入金门。"]
  ];

  // 木鱼音效（Web Audio 合成，无需外部文件）
  let audioCtx = null;
  function woodFish() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = 600;
      o.type = "sine";
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.3);
    } catch(e) {}
  }

  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  const todayIndex = dayOfYear % verses.length;
  let currentIndex = todayIndex;

  const verseEl = document.getElementById("verse");
  const line1 = document.getElementById("line1");
  const line2 = document.getElementById("line2");

  function showVerse(i) {
    verseEl.classList.add("fade");
    woodFish();
    setTimeout(() => {
      line1.textContent = verses[i][0];
      line2.textContent = verses[i][1];
      verseEl.classList.remove("fade");
      if(translateOn) updateTranslate();
    }, 600);
  }

  line1.textContent = verses[currentIndex][0];
  line2.textContent = verses[currentIndex][1];

  document.getElementById("btnNext").onclick = () => {
    currentIndex = (currentIndex + 1) % verses.length; showVerse(currentIndex);
  };
  document.getElementById("btnPrev").onclick = () => {
    currentIndex = (currentIndex - 1 + verses.length) % verses.length; showVerse(currentIndex);
  };
  document.getElementById("btnToday").onclick = () => {
    currentIndex = todayIndex; showVerse(currentIndex);
  };
  document.getElementById("btnFirst").onclick = () => {
    currentIndex = 0; showVerse(currentIndex);
  };

  // 看全文
  const fullPanel = document.getElementById("fullPanel");
  const fullContent = document.getElementById("fullContent");
  const fontControls = document.getElementById("fontControls");
  let fullFontSize = 1.1;
  document.getElementById("btnFull").onclick = () => {
    let html = "<h2>太上老君说常清静经</h2>";
    for(const v of verses){
      html += "<p>" + v[0] + "</p><p>" + v[1] + "</p>";
    }
    fullContent.innerHTML = html;
    fullContent.style.fontSize = fullFontSize + "rem";
    fullPanel.classList.add("show");
    fontControls.classList.add("show");
  };
  function closeFull(){
    fullPanel.classList.remove("show");
    fontControls.classList.remove("show");
  }
  function changeFontSize(delta){
    fullFontSize = Math.max(0.8, Math.min(2.5, fullFontSize + delta));
    fullContent.style.fontSize = fullFontSize + "rem";
  }
  let fullTranslated = false;
  function toggleFullTranslate(){
    fullTranslated = !fullTranslated;
    let html = "<h2>" + (fullTranslated ? "白 话 译 文" : "太上老君说常清静经") + "</h2>";
    if(fullTranslated){
      for(const t of translations){ html += "<p>" + t[0] + "</p>"; }
    } else {
      for(const v of verses){ html += "<p>" + v[0] + "</p><p>" + v[1] + "</p>"; }
    }
    fullContent.innerHTML = html;
    fullContent.style.fontSize = fullFontSize + "rem";
  }

  // 翻译面板
  const translatePanel = document.getElementById("translatePanel");
  const translateText = document.getElementById("translateText");
  let translateOn = false;
  function updateTranslate(){
    translateText.textContent = translations[currentIndex][0];
  }
  document.getElementById("btnTranslate").onclick = () => {
    translateOn = !translateOn;
    if(translateOn){
      updateTranslate();
      translatePanel.classList.add("show");
    } else {
      translatePanel.classList.remove("show");
    }
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") document.getElementById("btnNext").click();
    if (e.key === "ArrowLeft") document.getElementById("btnPrev").click();
  });

  // 实时时钟 + 白天/夜晚切换
  const week = ["日","一","二","三","四","五","六"];
  var autoTheme = true;

  function tick() {
    const n = new Date();
    document.getElementById("date").textContent =
      n.getFullYear() + " 年 " + (n.getMonth()+1) + " 月 " + n.getDate() + " 日 · 星期" + week[n.getDay()];
    const h = String(n.getHours()).padStart(2,"0");
    const m = String(n.getMinutes()).padStart(2,"0");
    const s = String(n.getSeconds()).padStart(2,"0");
    document.getElementById("clock").textContent = h + " : " + m + " : " + s;
    // 6:00-18:00 白天，其余夜晚；手动切换后不再自动
    if (autoTheme) {
      const hour = n.getHours();
      document.body.classList.toggle("day", hour >= 6 && hour < 18);
    }
    updateThemeIcon();
  }

  // 明暗手动切换
  function toggleTheme() {
    autoTheme = false;
    document.body.classList.toggle("day");
    updateThemeIcon();
  }
  function updateThemeIcon() {
    var btn = document.getElementById("themeBtn");
    if (!btn) return;
    var isDay = document.body.classList.contains("day");
    btn.textContent = isDay ? "☀️" : "🌙";
    btn.title = isDay ? "当前：白天，点击切换夜晚" : "当前：夜晚，点击切换白天";
  }

  tick();
  setInterval(tick, 1000);
</script>

<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
<script>
const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
let bgmOn = false;
function toggleBgm(){
  if(bgmOn){ bgm.pause(); bgmOn=false; musicBtn.textContent='🔇'; }
  else{ bgm.play(); bgmOn=true; musicBtn.textContent='🎵'; }
}
// 第一次点击页面任意位置自动播放音乐
function tryAutoPlay(){
  if(!bgmOn){
    bgm.play().then(()=>{ bgmOn=true; musicBtn.textContent='🎵'; }).catch(()=>{});
  }
  document.removeEventListener('click', tryAutoPlay);
  document.removeEventListener('keydown', tryAutoPlay);
}
document.addEventListener('click', tryAutoPlay);
document.addEventListener('keydown', tryAutoPlay);
</script>

</body>
