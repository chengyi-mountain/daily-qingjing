<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日清静 · 澄一</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "KaiTi", "STKaiti", "Kaiti SC", "楷体", "Songti SC", serif;
    color: #d8d4c8;
    overflow: hidden;
  }

  body {
    background: radial-gradient(ellipse at 50% 30%, #2a2d33 0%, #1a1c20 50%, #0e0f12 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }

  /* 远山剪影 */
  .mountains {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45%;
    pointer-events: none;
    opacity: 0.5;
  }

  /* 雾气 —— 双层飘动 */
  .mist {
    position: absolute;
    left: -20%;
    width: 140%;
    height: 30%;
    background: linear-gradient(to top, rgba(200,200,200,0.07), transparent);
    filter: blur(25px);
    pointer-events: none;
  }
  .mist-1 {
    bottom: 8%;
    animation: drift1 40s linear infinite;
  }
  .mist-2 {
    bottom: 22%;
    height: 20%;
    opacity: 0.6;
    animation: drift2 60s linear infinite reverse;
  }
  @keyframes drift1 {
    0%   { transform: translateX(-5%); }
    50%  { transform: translateX(5%); }
    100% { transform: translateX(-5%); }
  }
  @keyframes drift2 {
    0%   { transform: translateX(5%); }
    50%  { transform: translateX(-5%); }
    100% { transform: translateX(5%); }
  }

  /* 顶部日期 */
  .date {
    position: absolute;
    top: 2.5rem;
    font-size: 0.95rem;
    letter-spacing: 0.4em;
    color: #8a8a8a;
    font-family: "Songti SC", serif;
    text-align: center;
    line-height: 2;
  }
  .clock {
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    color: #b8b4a8;
    font-variant-numeric: tabular-nums;
  }

  /* 中央诗句 —— 带淡入 */
  .verse {
    max-width: 720px;
    text-align: center;
    z-index: 2;
    position: relative;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .verse.fade {
    opacity: 0;
    transform: translateY(10px);
  }

  .verse .line {
    font-size: clamp(1.5rem, 3.5vw, 2.4rem);
    line-height: 2.2;
    letter-spacing: 0.15em;
    color: #e8e4d8;
    text-shadow: 0 0 30px rgba(200,200,180,0.1);
  }

  .verse .source {
    margin-top: 3rem;
    font-size: 0.95rem;
    letter-spacing: 0.5em;
    color: #7a7a7a;
  }

  /* 底部操作按钮 */
  .actions {
    position: absolute;
    bottom: 4.5rem;
    display: flex;
    gap: 1.5rem;
    z-index: 3;
  }
  .actions button {
    background: transparent;
    border: 1px solid #3a3a3a;
    color: #8a8a8a;
    padding: 8px 22px;
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .actions button:hover {
    border-color: #b85450;
    color: #d8d4c8;
  }

  /* 底部落款 */
  .footer {
    position: absolute;
    bottom: 1.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: #5a5a5a;
  }

  .seal {
    display: inline-block;
    margin-left: 0.5rem;
    padding: 2px 8px;
    border: 1px solid #8b3a3a;
    color: #b85450;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    transform: translateY(-2px);
  }

  /* 分隔线 */
  .divider {
    width: 60px;
    height: 1px;
    background: #4a4a4a;
    margin: 2rem auto;
  }
</style>
</head>
<body>

<div class="date">
  <div id="date"></div>
  <div class="clock" id="clock"></div>
</div>

<div class="verse" id="verse">
  <div class="line" id="line1"></div>
  <div class="line" id="line2"></div>
  <div class="divider"></div>
  <div class="source">太上老君说常清静经</div>
</div>

<svg class="mountains" viewBox="0 0 1440 400" preserveAspectRatio="none">
  <path d="M0,300 L120,200 L240,260 L360,150 L480,230 L600,180 L720,250 L840,170 L960,240 L1080,190 L1200,260 L1320,210 L1440,280 L1440,400 L0,400 Z" fill="#1f2228"/>
  <path d="M0,340 L180,280 L320,320 L480,260 L640,310 L800,270 L960,320 L1120,280 L1280,320 L1440,290 L1440,400 L0,400 Z" fill="#171920"/>
</svg>
<div class="mist mist-1"></div>
<div class="mist mist-2"></div>

<div class="actions">
  <button id="btnPrev">上一句</button>
  <button id="btnToday">今日</button>
  <button id="btnNext">下一句</button>
</div>

<div class="footer">
  澄一 · 每日清静<span class="seal">澄一</span>
</div>

<script>
  const verses = [
    ["大道无形，生育天地；", "大道无情，运行日月；大道无名，长养万物。"],
    ["人能常清静，", "天地悉皆归。"],
    ["常能遣其欲，而心自静；", "澄其心，而神自清。"],
    ["内观其心，心无其心；", "外观其形，形无其形；远观其物，物无其物。"],
    ["观空亦空，", "空无所空。"],
    ["寂无所寂，欲岂能生；", "欲既不生，即是真静。"],
    ["真常应物，真常得性；", "常应常静，常清静矣。"],
    ["如此清静，渐入真道；", "既入真道，名为得道。"],
    ["上士无争，下士好争；", "上德不德，下德执德。"],
    ["众生所以不得真道者，", "为有妄心。"],
    ["烦恼妄想，忧苦身心；", "便遭浊辱，流浪生死。"],
    ["真常之道，悟者自得；", "得悟道者，常清静矣。"],
    ["吾不知其名，", "强名曰道。"],
    ["清者浊之源，", "动者静之基。"],
    ["夫人神好清，而心扰之；", "人心好静，而欲牵之。"]
  ];

  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  const todayIndex = dayOfYear % verses.length;

  let currentIndex = todayIndex;

  const verseEl = document.getElementById("verse");
  const line1 = document.getElementById("line1");
  const line2 = document.getElementById("line2");

  function showVerse(i) {
    verseEl.classList.add("fade");
    setTimeout(() => {
      line1.textContent = verses[i][0];
      line2.textContent = verses[i][1];
      verseEl.classList.remove("fade");
    }, 600);
  }

  // 初始渲染（无动画）
  line1.textContent = verses[currentIndex][0];
  line2.textContent = verses[currentIndex][1];

  document.getElementById("btnNext").onclick = () => {
    currentIndex = (currentIndex + 1) % verses.length;
    showVerse(currentIndex);
  };
  document.getElementById("btnPrev").onclick = () => {
    currentIndex = (currentIndex - 1 + verses.length) % verses.length;
    showVerse(currentIndex);
  };
  document.getElementById("btnToday").onclick = () => {
    currentIndex = todayIndex;
    showVerse(currentIndex);
  };

  // 键盘左右方向键也能翻
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") document.getElementById("btnNext").click();
    if (e.key === "ArrowLeft") document.getElementById("btnPrev").click();
  });

  const week = ["日","一","二","三","四","五","六"];
  function renderDate() {
    const n = new Date();
    document.getElementById("date").textContent =
      n.getFullYear() + " 年 " + (n.getMonth()+1) + " 月 " + n.getDate() + " 日 · 星期" + week[n.getDay()];
    const h = String(n.getHours()).padStart(2, "0");
    const m = String(n.getMinutes()).padStart(2, "0");
    const s = String(n.getSeconds()).padStart(2, "0");
    document.getElementById("clock").textContent = h + " : " + m + " : " + s;
  }
  renderDate();
  setInterval(renderDate, 1000);
</script>

</body>
</html>
